<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Profile Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f4f6fb;
}

/* Header */
.header {
  background: linear-gradient(90deg, #6a11cb, #b721ff);
  padding: 16px 30px;
  color: white;
  font-size: 20px;
  font-weight: 600;
}

/* Layout */
.container {
  max-width: 1000px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 25px;
}

/* Sidebar */
.sidebar {
  background: white;
  border-radius: 16px;
  padding: 20px;
}

.profile-pic {
  width: 100px;
  height: 100px;
  background: #9b7bff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  color: white;
  margin: auto;
}

.sidebar h3 {
  text-align: center;
  margin: 10px 0 4px;
}

.sidebar p {
  text-align: center;
  color: #666;
  font-size: 14px;
}

.sidebar button {
  margin-top: 12px;
  width: 100%;
  padding: 10px;
  border-radius: 20px;
  border: none;
  background: #6c4dff;
  color: white;
  cursor: pointer;
}

/* Content */
.content {
  background: white;
  border-radius: 16px;
  padding: 25px;
}

.section {
  margin-bottom: 30px;
}

.section h4 {
  margin-bottom: 15px;
}

/* Form */
.form-group {
  margin-bottom: 15px;
}

.form-group label {
  font-size: 14px;
  color: #555;
}

.form-group input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

/* Toggle */
.toggle {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.switch {
  width: 45px;
  height: 24px;
  background: #ccc;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
}

.switch::after {
  content: "";
  width: 18px;
  height: 18px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  transition: 0.3s;
}

.switch.active {
  background: #6c4dff;
}

.switch.active::after {
  left: 24px;
}

/* Save */
.save-btn {
  background: #6c4dff;
  color: white;
  padding: 12px 30px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-size: 16px;
}

.success {
  color: green;
  margin-top: 10px;
  display: none;
}
</style>
</head>

<body>

<div class="header">Admin Profile Settings</div>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="profile-pic" id="avatar">A</div>
    <h3>Admin User</h3>
    <p>admin@community.com</p>
    <input type="file" hidden id="upload" onchange="previewImage(event)">
    <button onclick="document.getElementById('upload').click()">Change Photo</button>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- Profile -->
    <div class="section">
      <h4>Profile Information</h4>

      <div class="form-group">
        <label>Name</label>
        <input id="name" value="Admin User">
      </div>

      <div class="form-group">
        <label>Username</label>
        <input id="username" value="admin">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input id="email" value="admin@community.com">
      </div>
    </div>

    <!-- Password -->
    <div class="section">
      <h4>Change Password</h4>

      <div class="form-group">
        <label>Current Password</label>
        <input type="password">
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password">
      </div>
    </div>

    <!-- Settings -->
    <div class="section">
      <h4>Settings</h4>

      <div class="toggle">
        Email Notifications
        <div class="switch active" onclick="toggle(this)"></div>
      </div>

      <div class="toggle">
        Private Profile
        <div class="switch" onclick="toggle(this)"></div>
      </div>

      <div class="toggle">
        Dark Mode
        <div class="switch" onclick="toggle(this)"></div>
      </div>
    </div>

    <button class="save-btn" onclick="save()">Save Changes</button>
    <div class="success" id="success">✔ Profile updated successfully</div>

  </div>
</div>

<script>
function toggle(el) {
  el.classList.toggle("active");
}

function save() {
  document.getElementById("success").style.display = "block";
  setTimeout(() => {
    document.getElementById("success").style.display = "none";
  }, 2000);
}

function previewImage(event) {
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById("avatar").style.backgroundImage = `url(${reader.result})`;
    document.getElementById("avatar").style.backgroundSize = "cover";
    document.getElementById("avatar").textContent = "";
  };
  reader.readAsDataURL(event.target.files[0]);
}
</script>

</body>
</html>
