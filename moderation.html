<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel – Moderation</title>
  <link rel="stylesheet" href="moderation.css">
</head>
<body>

<header class="topbar">
  <div class="left">⬅ Back to Site | <strong>Admin Panel</strong></div>
  <div class="right">Welcome, admin</div>
</header>

<nav class="nav">
  <button class="active">Moderation</button>
  <button>Users</button>
  <button>Communities</button>
  <button>Reports</button>
  <button>Analytics</button>
  <button>Settings</button>
</nav>
<main class="container">

  <h2>Content Moderation</h2>

  <div class="filters">
    <select>
      <option>All Content</option>
      <option>Posts</option>
      <option>Comments</option>
    </select>

    <select>
      <option>Status: All</option>
      <option>Pending</option>
      <option>Approved</option>
      <option>Rejected</option>
    </select>

    <input type="search" placeholder="Search by user or content...">
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Type</th>
          <th>Content</th>
          <th>Reported</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="moderationTable">
        <tr>
          <td>techUser12</td>
          <td>Post</td>
          <td>This post violates community rules...</td>
          <td>Spam</td>
          <td><span class="badge pending">Pending</span></td>
          <td>
            <button class="approve">Approve</button>
            <button class="reject">Reject</button>
            <button class="delete">Delete</button>
          </td>
        </tr>

        <tr>
          <td>gamerX</td>
          <td>Comment</td>
          <td>Offensive language used here...</td>
          <td>Abuse</td>
          <td><span class="badge pending">Pending</span></td>
          <td>
            <button class="approve">Approve</button>
            <button class="reject">Reject</button>
            <button class="delete">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>
<script src="moderation.js"></script>
</body>
</html>
